name: Verify test-generation artifacts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published inputs, generated files and official metrics
        run: python3 scripts/verify_test_generation.py
      - name: Run offline recovery regression checks
        working-directory: code/test-generation-20261114/controller
        run: python3 -m unittest -v test_generation_outcome.py test_seed_evaluation.py
      - name: Verify empirical research evidence snapshot
        run: python3 scripts/verify_research_publication.py
      - name: Verify full Req2Test delivery and recovery bookkeeping
        run: |
          python3 'reports/20261118-010456-Req2Test全量尾项恢复与统计修正/verify_full_delivery.py'
          python3 -m unittest discover -s 'reports/20261118-010456-Req2Test全量尾项恢复与统计修正/' -p test_project_status.py
